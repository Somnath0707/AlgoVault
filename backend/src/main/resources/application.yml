server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

app:
  auth:
    mode: oauth

db:
  pool:
    max-size: ${DB_POOL_SIZE:10}
    min-idle: ${DB_POOL_MIN_IDLE:2}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algovault}
    username: ${SPRING_DATASOURCE_USERNAME:algovault}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL:false}
      timeout: 3000ms

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:algovault-api}
  audience: ${JWT_AUDIENCE:algovault-extension}
  expiration: ${JWT_EXPIRATION_MS:86400000}

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:chrome-extension://nglebofiomebgndkkdecnmolafjdphhf}

logging:
  level:
    root: INFO
    com.algovault: INFO

